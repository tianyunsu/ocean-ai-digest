name: Update Ocean AI Digest

# 每日自动更新 + 支持手动触发
on:
  # 每天北京时间 08:00 自动执行（UTC 00:00）
  schedule:
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/tianyunsu/ocean-ai-digest.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      # 步骤 1：从两个来源增量抓取并合并，已内置 URL 去重 + 标题去重 + 链接有效性验证
      - name: Fetch and validate articles from source sites
        run: python scripts/fetch_articles.py
        continue-on-error: false

      # 步骤 2：生成分类页面
      - name: Generate category pages
        run: python scripts/generate_pages.py

      # 步骤 3：提交并推送变更（GitHub Pages 配置为 "Deploy from a branch"，推送后自动部署）
      - name: Commit and push changes
        run: |
          git stash
          git pull --rebase origin main
          git stash pop
          git add .nojekyll _data/*.json categories/*.html index.html all.html
          git diff --staged --quiet || git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M')"
          git push
